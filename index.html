<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6693">
<meta name="color-scheme" content="light">
<title>NMCP Malaria Partner Mapping · Ministry of Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef2f6; --s1:#ffffff; --s2:#f7f9fb; --s3:#e6eef6; --line:#cfdbe7; --line2:#e3eaf1;
  --ink:#0b2540; --muted:#1565c0; --faint:#147cd7;
  --dhis:#2c6693; --dhis2:#1565c0; --dhis3:#0d47a1;
  --sky:#56B4E9; --orange:#E69F00; --green:#009E73; --yellow:#F0E442;
  --blue:#0072B2; --verm:#D55E00; --purple:#CC79A7; --on:#ffffff; --frame:#009E73;
  --appw:560px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html:not(.w-p){--appw:820px}
html.w-l{--appw:100%}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;font-weight:500;font-size:16px;color:var(--ink);background-color:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select:disabled,input:disabled,input[readonly]{opacity:1;color:var(--dhis2);border-style:dashed;background-color:var(--s2)}
input[type=date]{min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--dhis2);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
textarea{min-height:90px;resize:vertical}
::placeholder{color:var(--dhis2);opacity:.6;font-weight:500}
option,optgroup{background:#fff;color:var(--ink);font-weight:500}
:focus-visible{outline:2px solid var(--dhis2);outline-offset:2px}
h1,h2{color:var(--dhis3)}

.app{max-width:var(--appw);margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:110px}
.frame{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--appw),100%);border-left:6px solid var(--frame);border-right:6px solid var(--frame);pointer-events:none;z-index:15}

/* header */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:20px 18px;background:var(--dhis);border-bottom:6px solid var(--frame);box-shadow:0 2px 6px rgba(11,37,64,.18)}
.mohlogo{width:88px;height:88px;border-radius:50%;background:#fff;object-fit:contain;flex:0 0 auto;box-shadow:0 0 0 3px #fff}
.ctxbtn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.ctxbtn b{color:#fff;font-weight:700;font-size:clamp(18px,5.2vw,26px)}
.ctxbtn small{color:#fff;font-weight:700;font-size:15px;margin-top:4px;opacity:.95}
.menubtn{position:relative;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);border:2px solid #fff;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menubtn span{display:block;width:24px;height:3px;border-radius:2px;background:#fff;transition:transform .2s ease,opacity .2s ease}
.menubtn.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.menubtn.open span:nth-child(2){opacity:0}
.menubtn.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.bnav{position:absolute;top:calc(100% + 6px);right:12px;width:270px;display:none;flex-direction:column;gap:2px;padding:8px;background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(11,37,64,.28);outline:3px solid var(--frame);z-index:30}
.bnav.open{display:flex;animation:drop .16s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.bnav button{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;font-size:15.5px;font-weight:700;color:var(--ink);text-align:left}
.bnav button:hover{background:var(--s2)}
.bnav button.on{background:#e3eef9;color:var(--dhis2)}
.bnav svg{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}

/* footer */
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(var(--appw),100%);z-index:20;background:var(--dhis);color:#fff;font-weight:700;text-align:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--frame);display:flex;flex-direction:column;align-items:center;gap:3px}
.foot .f1{font-size:clamp(10px,3.1vw,14px);white-space:nowrap}
.foot .f2{font-size:clamp(10.5px,3vw,12.5px);line-height:1.35}
.foot .sep{margin:0 .45em}

main{padding:14px 18px 0}
html:not(.w-p) main{padding-left:24px;padding-right:24px}
.lh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--dhis3);margin:22px 4px 10px}
.lh:first-child{margin-top:8px}
.lh::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--dhis2),transparent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(11,37,64,.06)}
.muted{color:var(--dhis2)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--s3);color:var(--dhis3)}
.note{border-left:4px solid var(--orange);background:#fff4dc;padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 14px;color:var(--ink)}
.empty{padding:32px 16px;text-align:center;color:var(--dhis2);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;background:var(--dhis2);color:#fff;font-weight:700;font-size:15px;flex:1;box-shadow:0 1px 2px rgba(13,71,161,.25)}
.btn.sec{background:#fff;color:var(--dhis2);border:1.5px solid var(--dhis2);box-shadow:none}
.btn.danger{background:var(--verm);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;flex:0 0 auto}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--dhis2);font-weight:700;font-size:15px;margin:0 0 12px;padding:9px 16px 9px 12px;min-height:44px;background:#fff;border:1.5px solid var(--dhis2);border-radius:999px}
.back:hover{background:#e3eef9}
.backs{display:flex;gap:8px 10px;flex-wrap:wrap;margin:0 0 12px}.backs .back{margin:0}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* sheet cards on the home page */
.cards{display:grid;grid-template-columns:1fr;gap:14px}
html:not(.w-p) .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
html.w-l .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.rcard{display:flex;flex-direction:column;width:100%;height:100%;text-align:left;padding:0;border-radius:22px;border:2px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#fff) 0%,#fff 100%);transition:transform .12s ease}
.rcard:active{transform:scale(.985)}
.rcard:hover{border-color:var(--dhis3)}
.rcard .top{display:flex;align-items:center;gap:14px;padding:16px 16px 6px}
.rb{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--c);color:#07121b;flex:0 0 auto}
.rb svg{width:32px;height:32px;fill:none;stroke:#07121b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rcard .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.rcard .tt span{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dhis2)}
.rcard .tt b{font-size:18px;font-weight:900;color:var(--ink);line-height:1.2}
.rcard p{margin:0;padding:6px 16px 0;font-size:14px;color:var(--ink);flex:1}
.rcard .bot{display:flex;align-items:center;gap:10px;padding:12px 16px 16px}
.cnt{min-width:38px;text-align:center;font-weight:900;border-radius:999px;padding:4px 12px;background:var(--dhis2);color:#fff;font-size:14px}
.cnt.z{background:#fff;color:var(--dhis2);border:1.5px solid var(--line)}
.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);flex:0 0 auto;margin-left:auto}
.go svg{width:20px;height:20px;fill:none;stroke:#07121b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* page heading */
.phd{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.phd .rb{width:52px;height:52px;border-radius:14px}
.phd .rb svg{width:26px;height:26px}
.phd h1{margin:0;font-size:24px;font-weight:900;line-height:1.15}
.phd small{display:block;color:var(--dhis2);font-weight:700;font-size:13px}

/* text pages */
.prose p{margin:0 0 12px;font-size:15.5px;line-height:1.6}
.prose p:last-child{margin-bottom:0}
.prose h2{font-size:18px;margin:0 0 10px}
.irow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.irow:last-child{border-bottom:0}
.irow .in{width:34px;height:34px;border-radius:50%;background:var(--dhis2);color:#fff;font-weight:900;display:grid;place-items:center;flex:0 0 auto}
.irow .in.k{background:#e3eef9;color:var(--dhis3)}
.irow .in.k svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.irow b{display:block;font-size:16px;color:var(--dhis3);margin-bottom:3px}
.irow div{font-size:15px;line-height:1.55}

/* records list */
.tbar{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.tbar input{flex:1;min-width:180px}
.rl{display:grid;grid-template-columns:1fr;gap:10px}
html.w-l .rl{grid-template-columns:repeat(2,minmax(0,1fr))}
html.w-l .rl .empty{grid-column:1/-1}
.rec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(11,37,64,.06)}
.rec:hover{border-color:var(--dhis2)}
.rec .rid{display:grid;place-items:center;font-family:"Roboto Mono",ui-monospace,monospace;min-width:46px;height:46px;padding:0 6px;border-radius:12px;background:var(--c,var(--sky));color:#07121b;font-weight:900;font-size:12px;flex:0 0 auto}
.rec .rm{flex:1;min-width:0}
.rec .rm b{display:block;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rm small{display:block;font-size:13px;color:var(--dhis2);font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:#e3eef9;color:var(--dhis3);border:1px solid #9cc0e6}
.tg.ok{background:#dff3ec;color:#00664a;border-color:#8fd3bd}
.tg.off{background:#f7e6f0;color:#8a3b6a;border-color:#e3b3cf}
.chev{width:20px;height:20px;fill:none;stroke:var(--faint);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* form: every column of the sheet on its own row */
.allform{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
html:not(.w-p) .allform{max-width:820px;margin:0 auto}
.fsec{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fsh{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--dhis);color:#fff;font-size:16px;font-weight:900}
.fsh i{font-style:normal;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--dhis);display:grid;place-items:center;font-size:14px;font-weight:900;flex:0 0 auto}
.fld{padding:16px;border-bottom:1px solid var(--line2)}
.fld:last-child{border-bottom:0}
.fld>label{font-size:16.5px;font-weight:900;color:var(--dhis3);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.fld>label .cl{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;font-weight:700;color:#fff;background:var(--dhis2);border-radius:6px;padding:1px 7px;flex:0 0 auto}
.req{color:var(--verm)}
.hint{color:var(--dhis2);font-size:13px;font-weight:500;margin:-4px 0 8px}
.ferr{color:var(--verm);font-size:13px;font-weight:700;margin-top:6px}
.ferr:empty{display:none}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--verm)}
.fld.hid{display:none}
.mdrop{position:relative}
.mtog{display:flex;align-items:center;width:100%;min-height:48px;text-align:left;padding:9px 40px 9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.mtog[aria-expanded="true"]{border-color:var(--dhis2);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
.msum{display:flex;flex-wrap:wrap;gap:6px}
.mph{color:var(--dhis2);opacity:.7;font-size:16px}
.mpanel{margin-top:8px;border:1.5px solid var(--dhis2);border-radius:12px;padding:10px;background:var(--s2);display:flex;flex-direction:column;gap:10px}
.mpanel[hidden]{display:none}
.mdone{align-self:flex-end}
.fld.bad .mtog{border-color:var(--verm)}
.fld.bad .checks{outline:1px dashed var(--verm);outline-offset:4px;border-radius:10px}
.checks{display:flex;flex-direction:column;gap:8px}
html:not(.w-p) .checks{display:grid;grid-template-columns:1fr 1fr}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:12px;padding:10px 12px;min-height:48px;font-size:15px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--line)}
.ck .cbx{width:22px;height:22px;border-radius:6px;border:3px solid var(--dhis2);flex:0 0 auto;display:grid;place-items:center;background:#fff}
.ck.on{background:#e3eef9;border-color:var(--dhis2);color:var(--dhis3)}
.ck.on .cbx{background:var(--dhis2)}
.ck.on .cbx::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck:disabled{opacity:.45;cursor:not-allowed}
.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(var(--appw),100%);z-index:25;display:flex;gap:10px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);border-top:6px solid var(--frame);box-shadow:0 -2px 8px rgba(11,37,64,.06)}
html:not(.w-p) .fbar{justify-content:center}
html:not(.w-p) .fbar .btn{max-width:260px}
body[data-view="form"] .foot{display:none}

/* reference lists */
.refgrid{display:grid;grid-template-columns:1fr;gap:12px}
html:not(.w-p) .refgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
html.w-l .refgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
details.reg{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(11,37,64,.06);align-self:start}
details.reg>summary{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;list-style:none}
details.reg>summary::-webkit-details-marker{display:none}
details.reg>summary::after{content:"";width:9px;height:9px;border:solid var(--dhis2);border-width:0 3px 3px 0;transform:rotate(45deg);margin:0 4px 4px auto;transition:transform .15s;flex:0 0 auto}
details.reg[open]>summary::after{transform:rotate(-135deg);margin-bottom:-2px}
details.reg[open]>summary{border-bottom:1px solid var(--line)}
details.reg .gname{font-size:15.5px;font-weight:900;color:var(--dhis3);flex:1;min-width:0}
details.reg .gname small{display:block;font-size:12.5px;font-weight:700;color:var(--dhis2)}
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:14.5px}
.vrow:last-child{border-bottom:0}
.vrow i{font-style:normal;font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;color:var(--dhis2);min-width:22px}
.vrow .use{margin-left:auto;font-size:12.5px;font-weight:900;color:var(--dhis3);background:var(--s3);border-radius:999px;padding:2px 9px}
.fs{font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dhis3);padding:12px 14px 4px;background:var(--s2);border-bottom:1px solid var(--line2)}
.chl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px;border-bottom:1px solid var(--line2)}
.chl:last-child{border-bottom:0}
.chl .dn{width:100%;font-weight:900;color:var(--ink);font-size:14px}
.vc{font-size:12.5px;border-radius:6px;padding:2px 8px;background:#e3eef9;color:var(--dhis3);font-weight:700}
.srcl{font-size:12.5px;color:var(--dhis2);margin:12px 4px 0;word-break:break-word}

/* sheet and toast */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
html:not(.w-p) .sheet{align-items:center;padding:24px}
.sbox{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
html:not(.w-p) .sbox{border-radius:22px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sbox h2{margin:0 0 8px;font-size:19px}
.sbox p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--dhis3);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:360px){.mohlogo{width:70px;height:70px}.menubtn{width:46px;height:46px}}
@media (max-height:500px) and (orientation:landscape){.appbar{padding:8px 16px}.mohlogo{width:48px;height:48px}}
@media print{.foot,.frame,.appbar,.fbar,.tbar{display:none!important}body{background:#fff}}
</style>
</head>
<body data-view="home">

const partner = id => DB.dir.find(p => String(p.pid) === String(id));
/* Partner ID is the date and time of submission: DDMMYYYYHHMMSS */
function stampPid(acr, name){
  /* the acronym in capitals; if there is none, the initials of the organization name */
  let pre = String(acr || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!pre) pre = String(name || '').split(/\s+/).filter(w => /^[A-Za-z]/.test(w) && !/^(of|and|the|for|in)$/i.test(w)).map(w => w[0].toUpperCase()).join('');
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const fmt = () => pre + z(d.getDate()) + z(d.getMonth() + 1) + d.getFullYear() + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
  let id = fmt();
  while (partner(id)){ d.setSeconds(d.getSeconds() + 1); id = fmt(); }
  return id;
}

  m.innerHTML = head('intro') +
  '<div class="card prose"><h2>Introduction</h2>' +
  '<p>The National Malaria Control Programme (NMCP), Ministry of Health, is undertaking a national mapping of organizations and partners supporting malaria interventions (donor, advisory, prevention, diagnosis, treatment, surveillance, research and related health system strengthening activities) in Sierra Leone. This exercise will establish a comprehensive picture of <b>who is doing what, where, with which resources and over what period</b>, including coverage at district and chiefdom levels.</p>' +
  '<p>The findings will support coordinated planning, identify service and funding gaps, reduce duplication and strengthen alignment of partner investments with national malaria priorities. We therefore request your organization to complete the <b>Malaria Partner Mapping Tool</b>.</p>' +
  '<p>Participation is encouraged from all relevant organizations, including development partners, non governmental organizations, faith based organizations, community based organizations, academic institutions and private sector entities. Organizations delivering malaria services through integrated health programmes are also requested to participate, even where they do not have a standalone malaria project.</p></div>' +
  '<div class="card prose"><h2>Instruction</h2><p>Please follow the steps in the <b>Instructions</b> sheet and submit one consolidated workbook for your organization within one week of receipt. Kindly nominate a focal person to support clarification, validation and subsequent updates.</p></div>' +
  contactCard() +
  '<div class="row" style="margin-top:4px"><button class="btn" data-go="instr">Go to Instructions</button></div>';
}
function contactCard(){
  return '<div class="card"><div class="irow"><span class="in k">' + IC.mail + '</span><div><b>Contact</b>For assistance in completing the tool, please contact <b style="display:inline;font-size:inherit">Alex Ogwal</b> at aogwal@leap-global.org or +23280028962.</div></div></div>';
}

/* ---------- Instructions ---------- */
function vInstr(m){
  const steps = [
    ['Instruction', 'Complete every field of each form, using the drop-down options where they are provided.', 'dir'],
    ['Partner Directory', 'Enter your organization once, providing its name, organization type, funding partners, agreement or MOU status and the official focal person’s contact details. Use the same unique Partner ID consistently throughout the workbook.', 'dir'],
    ['Technical Area map', 'Enter one row for each partner, intervention, district and chiefdom combination. For example, an intervention implemented in three chiefdoms requires three separate rows. Include project descriptions, target populations, supported facilities or communities, implementation dates, status, indicators, targets and latest achievements where available.', 'tech'],
    ['Coordination Contacts', 'Provide the contacts of individuals within the organization who coordinate different programmes, and indicate the relevant technical working groups or coordination forums they can be involved in.', 'con']
  ];
  m.innerHTML = head('instr') +
    '<div class="card prose"><h2>Purpose</h2><p>Maintain a single NMCP view of who is doing what, where, with which resources, for which populations, and over what period.</p></div>' +
    '<div class="card">' + steps.map((s, i) => '<div class="irow"><span class="in">' + (i + 1) + '</span><div><b>' + esc(s[0]) + '</b>' + esc(s[1]) + '</div></div>').join('') + '</div>' +
    '<div class="card">' +
      '<div class="irow"><span class="in k">' + IC.check + '</span><div><b>Data quality</b>Have the information reviewed by your organization’s designated focal person. Where information is unavailable, explain this in the relevant notes or description field rather than entering zero.</div></div>' +
      '<div class="irow"><span class="in k">' + IC.shield + '</span><div><b>Confidentiality</b>Do not enter personally sensitive information beyond the official professional contact details needed for coordination.</div></div>' +
      '<div class="irow"><span class="in k">' + IC.mail + '</span><div><b>Queries</b>For assistance in completing the tool, please contact NMCP contact Alex Ogwal at aogwal@leap-global.org or +23280028962.</div></div>' +
    '</div>' +
    '<div class="row"><button class="btn" data-go="dir">Start with the Partner Directory</button></div>';
}

/* ---------- list of entries in a data sheet ---------- */
const LISTQ = {};
function summary(k, r){
  if (k === 'dir') return { id:r.pid, t:r.name + (r.acr ? ' (' + r.acr + ')' : ''), s:[r.otype, r.focal].filter(Boolean).join(' · '), tags:[r.ostat && [r.ostat, r.ostat === 'Active' ? 'ok' : 'off'], r.mou && ['MOU: ' + r.mou], r.pfund && [r.pfund]].filter(Boolean) };
  if (k === 'tech') return { id:r.pid, t:r.tarea + (r.act ? ' · ' + r.act : ''), s:[r.pname, [r.dist, r.chief].filter(Boolean).join(', ')].filter(Boolean).join(' · '), tags:[r.status && [r.status, r.status === 'Active' ? 'ok' : 'off'], r.level && [r.level], r.pfund && [r.pfund]].filter(Boolean) };
  const p = partner(r.org);
  return { id:p ? p.pid : '', t:r.cname, s:[r.role, p ? p.name : ''].filter(Boolean).join(' · '), tags:(r.twg || []).map(x => [x]) };
}
function vList(m, k){
  const s = SH(k), rows = DB[k];
  const sub = k === 'dir' ? 'One row per organization' : k === 'tech' ? 'One row per partner, intervention, district and chiefdom' : 'Key partner contacts';
  let pre = '';
  if (k !== 'dir' && !DB.dir.length) pre = '<div class="note">Add your organization to the Partner Directory first. The Partner ID and name here are taken from it.</div>';
  m.innerHTML = head(k, s.n + ' · ' + sub) + pre +
    '<div class="tbar"><input id="q" type="search" placeholder="Search entries" value="' + esc(LISTQ[k] || '') + '" aria-label="Search entries"><button class="btn sm" id="add">' + IC.plus + 'Add entry</button></div>' +
    '<div class="rl" id="rl"></div>';
  const draw = () => {
    const q = (LISTQ[k] || '').toLowerCase();
    const list = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
    $('#rl').innerHTML = list.length ? list.map(r => {
      const x = summary(k, r);
      return '<button class="rec" style="--c:' + s.c + '" data-id="' + r.id + '"><span class="rid">' + esc(x.id || '·') + '</span><span class="rm"><b>' + esc(x.t || 'Untitled') + '</b><small>' + esc(x.s) + '</small>' +
        (x.tags.length ? '<span class="tags">' + x.tags.map(t => '<span class="tg ' + (t[1] || '') + '">' + esc(t[0]) + '</span>').join('') + '</span>' : '') + '</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>';
    }).join('') : '<div class="empty">' + (rows.length ? 'No entry matches your search.' : 'No entries yet. Tap Add entry to begin.') + '</div>';
  };
  draw();
  $('#q').addEventListener('input', e => { LISTQ[k] = e.target.value; draw(); });
  $('#add').addEventListener('click', () => {
    if (k !== 'dir' && !DB.dir.length) { toast('Add an organization to the Partner Directory first'); return; }
    openForm(k, null);
  });
  $('#rl').addEventListener('click', e => { const b = e.target.closest('.rec'); if (b) openForm(k, rows.find(r => r.id === b.dataset.id)); });
}

/* ---------- form: each column of the sheet on its own row ---------- */
function partnerOptions(){ return DB.dir.map(p => [p.pid, p.pid + ' · ' + p.name + (p.acr ? ' (' + p.acr + ')' : '')]); }
function selectHtml(id, opts, val, ph){
  return '<select id="' + id + '"><option value="">' + esc(ph || 'Select') + '</option>' +
    opts.map(o => { const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>';
}
function districtHtml(id, val){
  return '<select id="' + id + '"><option value="">Select district</option>' + REGIONS.map(r =>
    '<optgroup label="' + esc(r) + ' Region">' + REF.dist.filter(d => d[1] === r).map(([d]) => '<option' + (d === val ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</optgroup>').join('') + '</select>';
}
function chiefHtml(id, dist, val){
  const list = (CHIEF_BY_DIST[dist] || []).slice().sort();
  if (!dist) return '<select id="' + id + '" disabled><option value="">Choose the district first</option></select>';
  if (!list.length) return '<select id="' + id + '" disabled><option value="">No chiefdoms listed for ' + esc(dist) + '</option></select>';
  return selectHtml(id, list, val, (/^Western/.test(dist) ? 'Select zone in ' : 'Select chiefdom in ') + dist);
}
function fieldInput(k, c, r){
  const id = 'f_' + c.k, v = r[c.k] == null ? '' : r[c.k];
  switch (c.type){
    case 'auto': return '<input id="' + id + '" readonly value="' + esc(v) + '" placeholder="' + (k === 'dir' && c.k === 'pid' ? 'Given when you save' : 'Filled automatically') + '">';
    case 'select': return selectHtml(id, c.o, v);
    case 'partner': return selectHtml(id, partnerOptions(), v, 'Select organization');
    case 'district': return districtHtml(id, v);
    case 'chiefdom': return '<div id="w_chief">' + chiefHtml(id, r.dist, v) + '</div>';
    case 'area': return '<textarea id="' + id + '">' + esc(v) + '</textarea>';
    case 'multi': {
      const on = Array.isArray(v) ? v : [];
      return '<div class="checks" id="' + id + '">' + c.o.map(o => '<button type="button" class="ck' + (on.includes(o) ? ' on' : '') + '" data-v="' + esc(o) + '" aria-pressed="' + on.includes(o) + '"><span class="cbx"></span><span>' + esc(o) + '</span></button>').join('') + '</div>';
    }
    case 'mdrop': {
      const on = Array.isArray(v) ? v : [];
      return '<div class="mdrop" id="' + id + '"><button type="button" class="mtog" aria-expanded="false"><span class="msum"></span></button><div class="mpanel" hidden><div class="checks">' +
        c.o.map(o => '<button type="button" class="ck' + (on.includes(o) ? ' on' : '') + '" data-v="' + esc(o) + '" aria-pressed="' + on.includes(o) + '"><span class="cbx"></span><span>' + esc(o) + '</span></button>').join('') +
        '</div><button type="button" class="btn sm mdone">Done</button></div></div>';
    }
    default: return '<input id="' + id + '" type="' + (c.type === 'text' ? 'text' : c.type) + '" value="' + esc(v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.type === 'email' ? ' autocomplete="email" inputmode="email"' : c.type === 'tel' ? ' inputmode="tel"' : '') + '>';
  }
}
function openForm(k, rec){
  const isNew = !rec;
  const r = rec ? JSON.parse(JSON.stringify(rec)) : { id:uid() };
  if (isNew && k !== 'dir' && DB.dir.length === 1){ if (k === 'tech'){ r.pid = DB.dir[0].pid; r.pname = DB.dir[0].name; } else r.org = DB.dir[0].pid; }
  FORM = { k, r, isNew };
  document.body.dataset.view = 'form';
  const s = SH(k), cols = COLS[k];
  $('#main').innerHTML =
    '<div class="backs"><button class="back" data-go="home">' + IC.home + 'Back to Home</button><button class="back" id="fback">' + IC.back + 'Back to ' + esc(s.t) + '</button></div>' +
    '<div class="phd" style="--c:' + s.c + '"><div class="rb">' + IC[k] + '</div><div><h1>' + (isNew ? 'New entry' : 'Edit entry') + '</h1><small>' + esc(s.n) + ' · ' + cols.length + ' columns, one per row</small></div></div>' +
    '<form class="allform" id="frm" novalidate><section class="fsec"><div class="fsh"><i>' + esc(s.n.split('.')[0].length < 3 ? s.n.split('.')[0] : '·') + '</i>' + esc(s.t) + '</div>' +
    cols.map((c, i) => '<div class="fld" data-k="' + c.k + '"><label for="f_' + c.k + '"><span class="cl">' + (i + 1) + '.</span><span>' + esc(c.l) + (c.req ? ' <span class="req">*</span>' : '') + '</span></label>' +
      (c.hint ? '<p class="hint">' + esc(c.hint) + '</p>' : '') + fieldInput(k, c, r) + '<div class="ferr"></div></div>').join('') +
    '</section>' + (isNew ? '' : '<button type="button" class="btn danger" id="fdel" style="flex:0 0 auto">Delete this entry</button>') + '</form>' +
    '<div class="fbar"><button class="btn sec" id="fcancel">Cancel</button><button class="btn" id="fsave">' + IC.check + 'Save entry</button></div>';
  scrollTo(0, 0);
  wireForm();
}
function wireForm(){
  const { k, r } = FORM, cols = COLS[k];
  /* the primary funder is never ticked again as a secondary funder */
  const syncNot = () => cols.filter(c => c.not).forEach(c => {
    const pv = $('#f_' + c.not).value;
    $('#f_' + c.k).querySelectorAll('.ck').forEach(b => { const off = b.dataset.v === pv; b.disabled = off; if (off){ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); } });
  });
  const sumUp = () => document.querySelectorAll('.mdrop').forEach(m => {
    const on = Array.from(m.querySelectorAll('.ck.on')).map(b => b.dataset.v);
    m.querySelector('.msum').innerHTML = on.length ? on.map(v => '<span class="tg">' + esc(v) + '</span>').join('') : '<span class="mph">Select (optional)</span>';
  });
  /* questions that depend on an earlier answer, such as the MOU dates */
  const vis = () => { const o = readForm(); cols.forEach(c => { if (c.show) $('.fld[data-k="' + c.k + '"]').classList.toggle('hid', !c.show(o)); }); };
  syncNot(); sumUp(); vis();
  $('#frm').addEventListener('click', e => {
    const t = e.target.closest('.mtog');
    if (t){ const p = t.nextElementSibling, open = p.hidden; p.hidden = !open; t.setAttribute('aria-expanded', open); return; }
    if (e.target.closest('.mdone')){ const m = e.target.closest('.mdrop'); m.querySelector('.mpanel').hidden = true; m.querySelector('.mtog').setAttribute('aria-expanded', 'false'); return; }
    const b = e.target.closest('.ck'); if (!b || b.disabled) return;
    const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on); sumUp();
  });
  $('#frm').addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'f_pfund'){ syncNot(); sumUp(); }
    vis();
    if (k === 'tech' && id === 'f_pid'){ const p = partner(e.target.value); $('#f_pname').value = p ? p.name : ''; }
    if (k === 'tech' && id === 'f_dist') $('#w_chief').innerHTML = chiefHtml('f_chief', e.target.value, '');
    const f = e.target.closest('.fld'); if (f){ f.classList.remove('bad'); f.querySelector('.ferr').textContent = ''; }
  });
  $('#frm').addEventListener('submit', e => e.preventDefault());
  $('#fback').addEventListener('click', leaveForm);
  $('#fcancel').addEventListener('click', leaveForm);
  $('#fsave').addEventListener('click', saveForm);
  const del = $('#fdel'); if (del) del.addEventListener('click', askDelete);
}
function readForm(){
  const { k, r } = FORM, o = { id:r.id };
  COLS[k].forEach(c => {
    const el = $('#f_' + c.k);
    o[c.k] = c.type === 'multi' || c.type === 'mdrop' ? Array.from(el.querySelectorAll('.ck.on')).map(b => b.dataset.v) : (el ? el.value.trim() : '');
  });
  if (k === 'dir') o.pid = r.pid || stampPid(o.acr, o.name);
  return o;
}
function saveForm(){
  const { k, isNew } = FORM, o = readForm();
  const errs = {};
  COLS[k].forEach(c => { if (c.show && !c.show(o)) o[c.k] = ''; });
  COLS[k].forEach(c => { const v = o[c.k]; if (c.show && !c.show(o)) return; if (c.req && (Array.isArray(v) ? !v.length : !v)) errs[c.k] = 'This field is required.'; });
  ['email'].forEach(f => { if (o[f] && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o[f])) errs[f] = 'Enter a valid email address.'; });
  if (o.sd && o.ed && o.ed < o.sd) errs.ed = 'The end date is before the start date.';
  if (k === 'dir' && o.name && DB.dir.some(p => p.id !== o.id && p.name.toLowerCase() === o.name.toLowerCase())) errs.name = 'This organization is already in the directory.';
  document.querySelectorAll('.fld').forEach(f => { const m = errs[f.dataset.k] || ''; f.classList.toggle('bad', !!m); f.querySelector('.ferr').textContent = m; });
  const first = Object.keys(errs)[0];
  if (first){ document.querySelector('.fld[data-k="' + first + '"]').scrollIntoView({ behavior:'smooth', block:'center' }); toast(Object.keys(errs).length + ' field' + (Object.keys(errs).length > 1 ? 's need' : ' needs') + ' attention'); return; }
  if (isNew) DB[k].push(o); else DB[k][DB[k].findIndex(x => x.id === o.id)] = o;
  /* a renamed organization carries its new name into the Technical Area rows */
  if (k === 'dir') DB.tech.forEach(t => { if (String(t.pid) === String(o.pid)) t.pname = o.name; });
  persist(); toast('Entry saved'); render();
}
function leaveForm(){ render(); }
function askDelete(){
  const { k, r } = FORM;
  let extra = '';
  if (k === 'dir'){
    const nt = DB.tech.filter(t => String(t.pid) === String(r.pid)).length, nc = DB.con.filter(c => String(c.org) === String(r.pid)).length;
    if (nt || nc) extra = ' Its ' + [nt && nt + ' Technical Area ' + (nt > 1 ? 'entries' : 'entry'), nc && nc + ' coordination ' + (nc > 1 ? 'contacts' : 'contact')].filter(Boolean).join(' and ') + ' will be deleted too.';
  }
  dialog('<h2>Delete this entry?</h2><p>This cannot be undone.' + esc(extra) + '</p><div class="row"><button class="btn sec" id="dno">Keep it</button><button class="btn danger" id="dyes">Delete</button></div>');
  $('#dno').onclick = closeDialog;
  $('#dyes').onclick = () => {
    DB[k] = DB[k].filter(x => x.id !== r.id);
    if (k === 'dir'){ DB.tech = DB.tech.filter(t => String(t.pid) !== String(r.pid)); DB.con = DB.con.filter(c => String(c.org) !== String(r.pid)); }
    persist(); closeDialog(); toast('Entry deleted'); render();
  };
}

/* ---------- Reference Lists ---------- */
function vRef(m){
  const lists = [
    ['Organization Type', REF.otype, 'Partner Directory, column D'],
    ['Professional Area', REF.parea, 'Partner Directory, column E'],
    ['MOU status', REF.mou, 'Partner Directory, column O'],
    ['Organisational Status', REF.ostat, 'Partner Directory, column R and Technical Area, column O'],
    ['Primary Funder', REF.fund, 'Partner Directory, columns G and H and Technical Area, column K'],
    ['Technical Area', REF.tarea, 'Technical Area, column C'],
    ['Implementation Level', REF.level, 'Technical Area, column F'],
    ['Technical Working Group', REF.twg, 'Coordination Contacts, column F']
  ];
  const count = (key, val) => {
    const map = { 'Organization Type':['dir','otype'], 'Professional Area':['dir','parea'], 'MOU status':['dir','mou'], 'Technical Area':['tech','tarea'], 'Implementation Level':['tech','level'] };
    const n = (sheet, f) => DB[sheet].filter(r => Array.isArray(r[f]) ? r[f].includes(val) : r[f] === val).length;
    if (key === 'Organisational Status') return n('dir','ostat') + n('tech','status');
    if (key === 'Primary Funder') return n('dir','pfund') + n('dir','sfund') + n('tech','pfund');
    if (key === 'Technical Working Group') return n('con','twg');
    return map[key] ? n(map[key][0], map[key][1]) : 0;
  };
  const card = (t, vals, used) => '<details class="reg"><summary><span class="gname">' + esc(t) + '<small>' + vals.length + ' options · ' + esc(used) + '</small></span></summary><div class="vlist">' +
    vals.map((v, i) => { const c = count(t, v); return '<div class="vrow"><i>' + (i + 1) + '</i><span>' + esc(v) + '</span>' + (c ? '<span class="use">' + c + '</span>' : '') + '</div>'; }).join('') + '</div></details>';
  const nd = d => DB.tech.filter(r => r.dist === d).length;
  const geo =
    '<details class="reg"><summary><span class="gname">Region and District<small>' + REGIONS.length + ' regions, ' + REF.dist.length + ' districts · Technical Area, column G</small></span></summary>' +
      REGIONS.map(r => '<div class="fs">' + esc(r) + ' Region</div><div class="vlist">' + REF.dist.filter(d => d[1] === r).map(([d]) => '<div class="vrow"><span>' + esc(d) + '</span>' + (nd(d) ? '<span class="use">' + nd(d) + '</span>' : '') + '</div>').join('') + '</div>').join('') + '</details>' +
    '<details class="reg"><summary><span class="gname">Chiefdom / Zone<small>' + REF.chief.length + ' chiefdoms and Western Area zones by district · Technical Area, column H</small></span></summary>' +
      REGIONS.map(r => { const ds = REF.dist.filter(d => d[1] === r && CHIEF_BY_DIST[d[0]]); return ds.length ? '<div class="fs">' + esc(r) + ' Region</div>' + ds.map(([d]) => '<div class="chl"><span class="dn">' + esc(d) + ' (' + CHIEF_BY_DIST[d].length + ')</span>' + CHIEF_BY_DIST[d].map(c => '<span class="vc">' + esc(c) + '</span>').join('') + '</div>').join('') : ''; }).join('') + '</details>';
  m.innerHTML = head('ref', 'Controlled vocabulary for the drop-down fields') +
    '<p class="muted sm" style="margin:-4px 4px 12px;font-weight:700">Open a list to see its options. The number on the right shows how many entries use that option.</p>' +
    '<div class="refgrid">' + lists.map(l => card(l[0], l[1], l[2])).join('') + geo + '</div>' +
    (REF.src ? '<p class="srcl">' + esc(REF.src) + '</p>' : '');
}

/* ---------- download the workbook (Excel 2003 XML, opens in Excel) ---------- */
function exportWorkbook(){
  const total = DB.dir.length + DB.tech.length + DB.con.length;
  if (!total){ toast('There are no entries to download yet'); return; }
  const x = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const val = (r, c) => { let v = r[c.k]; if (Array.isArray(v)) v = v.join('; '); if (c.type === 'partner' && c.k === 'org'){ const p = partner(v); v = p ? p.name : ''; } return v; };
  const sheet = k => {
    const cols = COLS[k], name = SH(k).n;
    const hdr = '<Row>' + cols.map(c => '<Cell ss:StyleID="h"><Data ss:Type="String">' + x(c.l + (c.req ? '*' : '')) + '</Data></Cell>').join('') + '</Row>';
    const rows = DB[k].map(r => '<Row>' + cols.map(c => { const v = val(r, c), num = false;
      return '<Cell><Data ss:Type="' + (num ? 'Number' : 'String') + '">' + x(v) + '</Data></Cell>'; }).join('') + '</Row>').join('');
    return '<Worksheet ss:Name="' + x(name) + '"><Table>' + cols.map(() => '<Column ss:Width="150"/>').join('') + hdr + rows + '</Table></Worksheet>';
  };
  const xml = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
    '<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2C6693" ss:Pattern="Solid"/></Style></Styles>' +
    sheet('dir') + sheet('tech') + sheet('con') + '</Workbook>';
  const org = DB.dir[0] ? (DB.dir[0].acr || DB.dir[0].name).replace(/[^A-Za-z0-9]+/g, '_') : 'Partner';
  const filename = 'NMCP_Partner_Mapping_' + org + '_' + new Date().toISOString().slice(0, 10) + '.xls';
  const fallback = () => {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([xml], { type:'application/vnd.ms-excel' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Workbook downloaded'); }
    catch(e){ toast('This viewer cannot download files'); }
  };
  (window.claude && claude.use ? claude.use('downloads') : Promise.resolve(null)).then(d => {
    if (!d) return fallback();
    return d.save({ filename, data:xml }).then(() => toast('Workbook downloaded'), () => toast('The download was not saved'));
  }).catch(fallback);
}

render();
</script>
